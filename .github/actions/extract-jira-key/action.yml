name: Extract Jira issue key
description: PR 제목·브랜치에서 Jira 이슈 키(WEATHER-1 등)를 추출합니다.

inputs:
  title:
    description: PR 제목
    required: true
  branch:
    description: PR 소스 브랜치명
    required: true

outputs:
  issue_key:
    description: 추출된 Jira 이슈 키 (없으면 빈 문자열)
    value: ${{ steps.extract.outputs.issue_key }}

runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        BRANCH: ${{ inputs.branch }}
      run: |
        issue_key=$(printf '%s\n%s' "$TITLE" "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1)
        echo "issue_key=${issue_key}" >> "$GITHUB_OUTPUT"
        echo "Extracted Jira key: ${issue_key:-none}"
