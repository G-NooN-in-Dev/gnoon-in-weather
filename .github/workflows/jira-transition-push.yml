name: Jira transition on branch push

on:
  push:
    branches:
      - 'weather-*'

jobs:
  transition-to-in-progress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Jira issue key from branch
        id: jira_key
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          issue_key=$(printf '%s' "$BRANCH" | grep -oiE '^weather-[0-9]+$' | tr '[:lower:]' '[:upper:]')
          echo "issue_key=${issue_key}" >> "$GITHUB_OUTPUT"
          echo "Extracted Jira key: ${issue_key:-none}"

      - name: Compute Start Date from push commits
        id: start_date
        uses: ./.github/actions/jira-push-start-date

      - name: Login to Jira
        if: steps.jira_key.outputs.issue_key != ''
        uses: frieder/gha-jira-login@v1
        with:
          baseUrl: ${{ secrets.JIRA_BASE_URL }}
          email: ${{ secrets.JIRA_USER_EMAIL }}
          token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Set Start Date (first push only)
        if: steps.jira_key.outputs.issue_key != '' && vars.JIRA_FIELD_START_DATE != ''
        continue-on-error: true
        uses: ./.github/actions/jira-set-date-field
        with:
          issue_key: ${{ steps.jira_key.outputs.issue_key }}
          field_id: ${{ vars.JIRA_FIELD_START_DATE }}
          date: ${{ steps.start_date.outputs.date }}
          only_if_empty: 'true'
          base_url: ${{ secrets.JIRA_BASE_URL }}
          email: ${{ secrets.JIRA_USER_EMAIL }}
          token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Transition to 진행 중
        if: steps.jira_key.outputs.issue_key != ''
        uses: frieder/jira-issue-transition@v1
        with:
          issue: ${{ steps.jira_key.outputs.issue_key }}
          transition: ${{ vars.JIRA_TRANSITION_TO_IN_PROGRESS || '진행 중' }}
          comment: |
            브랜치에 push되었습니다.
            브랜치: ${{ github.ref_name }}
            커밋: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          retries: 2
          retryDelay: 5
          failOnError: false
