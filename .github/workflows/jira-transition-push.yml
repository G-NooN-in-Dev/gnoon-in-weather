name: Jira transition on branch push

on:
  push:
    branches:
      - 'weather-*'

jobs:
  extract-keys:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.extract.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        uses: ./.github/actions/jira-extract-keys-from-push

  transition-on-push:
    needs: extract-keys
    if: needs.extract-keys.outputs.keys != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        issue_key: ${{ fromJSON(needs.extract-keys.outputs.keys) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute Start Date from push commits
        id: start_date
        uses: ./.github/actions/jira-push-start-date

      - name: Login to Jira
        uses: frieder/gha-jira-login@v1
        with:
          baseUrl: ${{ secrets.JIRA_BASE_URL }}
          email: ${{ secrets.JIRA_USER_EMAIL }}
          token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Set Start Date (first push only)
        if: vars.JIRA_FIELD_START_DATE != ''
        continue-on-error: true
        uses: ./.github/actions/jira-set-date-field
        with:
          issue_key: ${{ matrix.issue_key }}
          field_id: ${{ vars.JIRA_FIELD_START_DATE }}
          date: ${{ steps.start_date.outputs.date }}
          only_if_empty: 'true'
          base_url: ${{ secrets.JIRA_BASE_URL }}
          email: ${{ secrets.JIRA_USER_EMAIL }}
          token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Transition to 진행 중
        uses: frieder/jira-issue-transition@v1
        with:
          issue: ${{ matrix.issue_key }}
          transition: ${{ vars.JIRA_TRANSITION_TO_IN_PROGRESS || '진행 중' }}
          comment: |
            브랜치에 push되었습니다.
            브랜치: ${{ github.ref_name }}
            이슈: ${{ matrix.issue_key }}
            커밋: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          retries: 2
          retryDelay: 5
          failOnError: false
