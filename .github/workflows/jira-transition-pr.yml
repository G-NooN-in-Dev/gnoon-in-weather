name: Jira transition on pull request merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  transition-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Jira issue key from PR branch
        id: jira_key
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          issue_key=$(printf '%s' "$BRANCH" | grep -oiE '^weather-[0-9]+$' | tr '[:lower:]' '[:upper:]')
          echo "issue_key=${issue_key}" >> "$GITHUB_OUTPUT"
          echo "Extracted Jira key: ${issue_key:-none}"

      - name: Login to Jira
        if: steps.jira_key.outputs.issue_key != ''
        uses: frieder/gha-jira-login@v1
        with:
          baseUrl: ${{ secrets.JIRA_BASE_URL }}
          email: ${{ secrets.JIRA_USER_EMAIL }}
          token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Transition to 완료
        if: steps.jira_key.outputs.issue_key != ''
        uses: frieder/jira-issue-transition@v1
        with:
          issue: ${{ steps.jira_key.outputs.issue_key }}
          transition: ${{ vars.JIRA_TRANSITION_TO_DONE || '완료' }}
          comment: |
            GitHub PR이 머지되었습니다.
            ${{ github.event.pull_request.html_url }}
          retries: 2
          retryDelay: 5
          failOnError: true

      - name: Compute End Date from PR merge
        id: end_date
        if: steps.jira_key.outputs.issue_key != ''
        run: |
          merged_at="${{ github.event.pull_request.merged_at }}"
          date_value=$(TZ=Asia/Seoul date -d "$merged_at" +%Y-%m-%d)
          echo "date=${date_value}" >> "$GITHUB_OUTPUT"
          echo "End date: ${date_value} (KST)"

      - name: Set End Date
        if: steps.jira_key.outputs.issue_key != '' && vars.JIRA_FIELD_END_DATE != ''
        uses: ./.github/actions/jira-set-date-field
        with:
          issue_key: ${{ steps.jira_key.outputs.issue_key }}
          field_id: ${{ vars.JIRA_FIELD_END_DATE }}
          date: ${{ steps.end_date.outputs.date }}
          only_if_empty: 'false'
          base_url: ${{ secrets.JIRA_BASE_URL }}
          email: ${{ secrets.JIRA_USER_EMAIL }}
          token: ${{ secrets.JIRA_API_TOKEN }}
